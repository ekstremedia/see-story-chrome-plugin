<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AmediAid</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <header class="masthead">
      <div class="masthead-inner">
        <img src="icons/icon48.png" alt="" width="44" height="44" />
        <div class="masthead-text">
          <h1 class="wordmark">AmediAid</h1>
          <p class="tagline" data-i18n="tagline"></p>
        </div>
        <div class="lang" role="group" aria-label="Spr&aring;k / Language">
          <button type="button" class="lang-btn" data-lang="nb">NB</button>
          <button type="button" class="lang-btn" data-lang="en">EN</button>
        </div>
      </div>
    </header>

    <main>
      <section>
        <h2 data-i18n="secAuto"></h2>

        <div class="row">
          <input type="checkbox" id="autoAmedia" class="switch" />
          <div class="row-text">
            <label for="autoAmedia" class="row-title" data-i18n="autoTitle"></label>
            <p class="row-note" data-i18n="autoNote"></p>
            <details>
              <summary data-i18n="grantsSummary"></summary>
              <p data-i18n="grantsBody"></p>
            </details>
          </div>
        </div>
      </section>

      <section>
        <h2 data-i18n="secClick"></h2>

        <div class="row">
          <input type="checkbox" id="clearStyling" class="switch" />
          <div class="row-text">
            <label for="clearStyling" class="row-title" data-i18n="stylingTitle"></label>
            <p class="row-note" data-i18n="stylingNote"></p>
          </div>
        </div>

        <div class="row">
          <input type="checkbox" id="hideConsent" class="switch" />
          <div class="row-text">
            <label for="hideConsent" class="row-title" data-i18n="consentTitle"></label>
            <p class="row-note" data-i18n="consentNote"></p>
          </div>
        </div>

        <div class="row">
          <input type="checkbox" id="hideAds" class="switch" />
          <div class="row-text">
            <label for="hideAds" class="row-title" data-i18n="adsTitle"></label>
            <p class="row-note" data-i18n="adsNote"></p>
          </div>
        </div>

        <div class="row">
          <input type="number" id="watchSeconds" min="0" max="300" step="5" />
          <div class="row-text">
            <label for="watchSeconds" class="row-title" data-i18n="watchTitle"></label>
            <p class="row-note" data-i18n="watchNote"></p>
          </div>
        </div>
      </section>

      <section>
        <div class="section-head">
          <h2 data-i18n="secRules"></h2>
          <button id="add" class="primary" data-i18n="addRule"></button>
        </div>
        <p class="section-note" data-i18n="rulesNote"></p>
        <div id="rules"></div>
        <p class="empty" id="empty" data-i18n="empty"></p>
      </section>
    </main>

    <footer>
      <button id="export" data-i18n="export"></button>
      <button id="import" data-i18n="import"></button>
      <input type="file" id="file" accept="application/json,.json" hidden />
      <span id="status" role="status"></span>
    </footer>

    <template id="rule-template">
      <div class="rule">
        <div class="rule-head">
          <input type="checkbox" data-field="enabled" class="switch small" data-i18n-attr="title aria-label:enabled" />
          <input type="text" data-field="name" class="name" data-i18n-attr="placeholder:ruleName" />
          <button data-action="delete" class="danger" data-i18n="delete"></button>
        </div>
        <label><span data-i18n="hosts"></span> <span class="hint" data-i18n="hostsHint"></span>
          <input type="text" data-field="match" placeholder="*.example.com" />
        </label>
        <label><span data-i18n="selectors"></span> <span class="hint" data-i18n="selectorsHint"></span>
          <textarea data-field="hide" rows="3" placeholder="#some-overlay&#10;.modal-backdrop"></textarea>
        </label>
        <label><span data-i18n="extraCss"></span> <span class="hint" data-i18n="extraCssHint"></span>
          <textarea data-field="css" rows="2" placeholder=".clamped { max-height: none !important; }"></textarea>
        </label>
      </div>
    </template>

    <script src="options.js"></script>
  </body>
</html>
